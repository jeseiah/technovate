<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TECHNOVATE 2026 QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 460px;
      margin: 20px auto;
      padding: 25px;
      background: #111d30;
      border: 1px solid #263449;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px #00000040;
    }

    .header {
      padding-bottom: 18px;
      border-bottom: 1px solid #263449;
    }

    h1 {
      font-size: 25px;
      letter-spacing: 2px;
      margin: 0;
    }

    .brand {
      color: #60a5fa;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-top: 7px;
    }

    .scanner-label {
      display: inline-block;
      margin-top: 22px;
      padding: 7px 14px;
      background: #163b35;
      color: #4ade80;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      margin: 22px auto;
      overflow: hidden;
      border-radius: 14px;
      background: #0b1220;
    }

    #reader video,
    #reader img {
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:active {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #result {
      display: none;
      padding: 18px;
      margin-top: 20px;
      border-radius: 12px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #result h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 17px;
    }

    #result p {
      margin-bottom: 0;
      font-size: 14px;
    }

    .success {
      display: block !important;
      background: #12372c;
      border: 1px solid #16a34a;
      color: #86efac;
    }

    .duplicate {
      display: block !important;
      background: #3b2d13;
      border: 1px solid #d97706;
      color: #fcd34d;
    }

    .error {
      display: block !important;
      background: #3b1c25;
      border: 1px solid #dc2626;
      color: #fca5a5;
    }

    .note {
      font-size: 11px;
      color: #64748b;
      margin-top: 22px;
      line-height: 1.6;
    }

    .footer {
      border-top: 1px solid #263449;
      margin-top: 20px;
      padding-top: 15px;
      color: #64748b;
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <h1>TECHNOVATE 2026</h1>
      <div class="brand">EVENT REGISTRATION SYSTEM</div>
    </div>

    <div class="scanner-label">ORGANIZER SCANNER</div>

    <h2>QR Code Scanner</h2>

    <p class="subtitle">
      Position the attendee's QR ticket inside the camera frame.
    </p>

    <div id="reader"></div>

    <button id="startButton" onclick="startScanner()">
      Start Camera Scanner
    </button>

    <div id="result"></div>

    <p class="note">
      Please ensure the QR code is clearly visible
      and properly positioned within the camera frame.
    </p>

    <div class="footer">
      TECHNOVATE 2026 • OFFICIAL CHECK-IN SYSTEM
    </div>

  </div>

  <script>
    let scanner = null;
    let isRunning = false;
    let isProcessing = false;

    const resultBox = document.getElementById('result');
    const startButton = document.getElementById('startButton');

    // Display a result message
    function showResult(type, title, message) {
      resultBox.className = type;
      resultBox.replaceChildren();

      const heading = document.createElement('h3');
      heading.textContent = title;

      const paragraph = document.createElement('p');
      paragraph.textContent = message;

      resultBox.append(heading, paragraph);
    }

    // Completely clear the previous result
    function clearResult() {
      resultBox.className = '';
      resultBox.replaceChildren();
      resultBox.style.display = 'none';
    }

    // Start or restart the scanner
    async function startScanner() {
      if (isRunning || isProcessing) return;

      // Clear the previous attendee's confirmation immediately
      clearResult();

      if (!window.opener) {
        showResult(
          'error',
          'Connection missing',
          'Please open this scanner using the Open QR Scanner button on the TECHNOVATE check-in page.'
        );
        return;
      }

      try {
        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        startButton.disabled = true;
        startButton.textContent = 'Opening camera...';

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          onScanSuccess
        );

        isRunning = true;
        startButton.style.display = 'none';

      } catch (error) {
        showResult(
          'error',
          'Camera error',
          error.name + ': ' + error.message
        );

        startButton.style.display = 'block';
        startButton.disabled = false;
        startButton.textContent = 'Try Again';
      }
    }

    // Handle a detected QR code
    async function onScanSuccess(decodedText) {
      if (isProcessing) return;

      isProcessing = true;

      try {
        await scanner.stop();
        isRunning = false;

        showResult(
          'duplicate',
          'QR CODE DETECTED',
          'Verifying attendee with the registration database...'
        );

        if (!window.opener) {
          throw new Error('The check-in page connection was lost.');
        }

        window.opener.postMessage({
          type: 'QR_SCAN',
          attendeeId: decodedText
        }, '*');

      } catch (error) {
        showResult('error', 'Scanner error', error.message);

        isProcessing = false;
        startButton.style.display = 'block';
        startButton.disabled = false;
        startButton.textContent = 'Try Again';
      }
    }

    // Receive the verification result from Apps Script
    window.addEventListener('message', async function(event) {
      if (event.source !== window.opener) return;

      const data = event.data;

      if (!data || data.type !== 'CHECKIN_RESULT') return;

      const response = data.result || {};

      if (response.status === 'success') {
        showResult(
          'success',
          'CHECK-IN SUCCESSFUL',
          response.message + ' Attendee: ' + (response.name || '')
        );

      } else if (response.status === 'already_checked_in') {
        showResult(
          'duplicate',
          'ALREADY CHECKED IN',
          response.message + ' Attendee: ' + (response.name || '')
        );

      } else {
        showResult(
          'error',
          'CHECK-IN FAILED',
          response.message || 'Unable to verify attendee.'
        );
      }

      isProcessing = false;

      startButton.style.display = 'block';
      startButton.disabled = false;
      startButton.textContent = 'Scan Next Attendee';
    });
  </script>
</body>
</html>
